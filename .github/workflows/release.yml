name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A release ships the same jars the Build workflow produces, one per node, after the same
  # tests and mixin audit have passed.
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog falls back to the commits since the previous tag.
          fetch-depth: 0
      - name: Check the tag matches mod.version
        run: |
          version=$(sed -n 's/^mod\.version=//p' gradle.properties | tr -d '\r')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod.version ${version} in gradle.properties" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: better-blending-*
          path: jars
          merge-multiple: true
      - name: Write changelog
        run: bash .github/scripts/changelog.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/changelog.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sources jars stay in the build artifacts; the release carries the mods.
          files=$(find jars -name '*.jar' ! -name '*-sources.jar' | sort)
          echo "$files"
          gh release create "${GITHUB_REF_NAME}" $files \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Better Blending ${GITHUB_REF_NAME#v}" \
            --notes-file "${RUNNER_TEMP}/changelog.md"

  # A release created with the workflow token does not trigger other workflows, so
  # CurseForge is published from here rather than on the release event.
  curseforge:
    needs: release
    uses: ./.github/workflows/curseforge.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
